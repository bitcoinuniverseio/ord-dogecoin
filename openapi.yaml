components:
  schemas:
    Drc20DecisionCoverage:
      type: object
      required: [decisionsFromHeight, indexedHeight]
      properties:
        decisionsFromHeight:
          type: integer
          nullable: true
          description: First height whose verdicts are retained; null if none yet
        indexedHeight:
          type: integer
          description: Height of the last indexed block
    Drc20OperationDecision:
      type: object
      required:
        - inscriptionId
        - txid
        - index
        - operation
        - tick
        - amount
        - verdict
        - reason
        - ruleset
        - checkpoint
        - reorgEpoch
        - coverage
      properties:
        inscriptionId:
          type: string
        txid:
          type: string
          description: Transaction that carried the operation
        index:
          type: integer
          description: Inscription index within the inscription's transaction
        operation:
          type: string
          nullable: true
          enum: [deploy, mint, inscribe-transfer, transfer]
        tick:
          type: string
          nullable: true
        amount:
          type: string
          nullable: true
          description: >-
            Ledger-effective atomic amount as an exact decimal string. Present
            only on accepted mint, inscribe-transfer and transfer operations.
        verdict:
          type: string
          enum: [accepted, rejected, not-evaluated]
        reason:
          type: string
          nullable: true
          description: >-
            The protocol error when rejected. When not-evaluated, one of
            drc20-index-disabled, outside-decision-coverage or
            not-a-drc20-operation.
        ruleset:
          type: string
          description: Rule set the verdict was produced under, currently drc20-v1
        checkpoint:
          type: object
          nullable: true
          required: [height, blockHash]
          properties:
            height:
              type: integer
            blockHash:
              type: string
          description: >-
            The block the verdict was decided in, or the inscription's block
            when not evaluated.
        reorgEpoch:
          type: integer
          description: >-
            Savepoint rollbacks the index had performed when the verdict was
            recorded. A record re-derived after a rollback carries a higher
            value than the one it replaced.
        coverage:
          $ref: '#/components/schemas/Drc20DecisionCoverage'
    InscriptionAddressJson:
      type: object
      required: [inscriptions, total_inscriptions]
      properties:
        inscriptions:
          type: array
          items:
            $ref: '#/components/schemas/InscriptionByAddressJson'
        total_inscriptions:
          type: integer
    InventoryLocation:
      type: object
      description: Where an inscription or transferable currently sits
      required: [txid, vout, offset, value, script_pubkey]
      properties:
        txid:
          type: string
        vout:
          type: integer
        offset:
          type: string
        value:
          type: string
          description: Exact value in atomic units
        script_pubkey:
          type: string
          description: Hex-encoded output script
        address:
          type: string
          nullable: true
    InscriptionInventoryItem:
      type: object
      required:
        - inscription_id
        - inscription_number
        - genesis_height
        - timestamp
        - subsidy_sats
      properties:
        inscription_id:
          type: string
        inscription_number:
          type: string
        genesis_height:
          type: integer
        timestamp:
          type: integer
        content_type:
          type: string
          nullable: true
          description: Resolved through the delegate, when there is one
        content_length:
          type: integer
          nullable: true
        subsidy_sats:
          type: string
          description: Subsidy of the genesis block, in atomic units
        location:
          allOf:
            - $ref: '#/components/schemas/InventoryLocation'
          nullable: true
          description: Null when the inscription sits on lost value
    OutputDetail:
      type: object
      description: >-
        One transaction output in the field layout upstream ord answers for
        GET /output/{outpoint} under Accept application/json. Integers are
        exact JSON numbers.
      required:
        - chain
        - network
        - outpoint
        - address
        - indexed
        - inscriptions
        - runes
        - sat_ranges
        - script_pubkey
        - spent
        - transaction
        - value
      properties:
        chain:
          type: string
          enum: [dogecoin]
        network:
          type: string
        outpoint:
          type: string
          description: txid:vout
        address:
          type: string
          nullable: true
          description: Null when the script is not an address
        indexed:
          type: boolean
        inscriptions:
          type: array
          items:
            type: string
          description: Inscription ids currently on the output
        runes:
          type: object
          description: Dunes on the output, keyed by spaced dune name
          additionalProperties:
            type: object
            required: [amount, divisibility, symbol]
            properties:
              amount:
                type: integer
              divisibility:
                type: integer
              symbol:
                type: string
                nullable: true
        sat_ranges:
          type: array
          nullable: true
          description: Null without --index-sats
          items:
            type: array
            items:
              type: integer
        script_pubkey:
          type: string
          description: The output script as assembly
        spent:
          type: boolean
        transaction:
          type: string
        value:
          type: integer
          description: Value in koinu
    InscriptionDetail:
      type: object
      description: >-
        One inscription in the field layout upstream ord answers for
        GET /inscription/{id} under Accept application/json. Integers are
        exact JSON numbers.
      required:
        - chain
        - network
        - id
        - number
        - address
        - content_type
        - content_length
        - height
        - fee
        - value
        - sat
        - satpoint
        - output
        - genesis_transaction
        - timestamp
        - charms
        - parents
        - child_count
        - rune
        - metaprotocol
        - previous
        - next
      properties:
        chain:
          type: string
          enum: [dogecoin]
        network:
          type: string
          description: mainnet, testnet, regtest or signet, as /api/v1/capabilities reports it
        id:
          type: string
        number:
          type: integer
          format: int64
        address:
          type: string
          nullable: true
          description: Null when the current output is not an address
        content_type:
          type: string
          nullable: true
          description: Resolved through the delegate, when there is one
        content_length:
          type: integer
          nullable: true
        height:
          type: integer
          description: Genesis height
        fee:
          type: integer
          format: int64
          description: Genesis fee in koinu
        value:
          type: integer
          format: int64
          description: Value of the current output in koinu
        sat:
          type: integer
          format: int64
          nullable: true
          description: Null without --index-sats
        satpoint:
          type: string
          description: txid:vout:offset of the current location
        output:
          type: string
          description: txid:vout of the current output
        genesis_transaction:
          type: string
        timestamp:
          type: integer
          description: Unix seconds of the genesis block
        charms:
          type: array
          items:
            type: string
          description: Always empty; not indexed by this fork
        parents:
          type: array
          items:
            type: string
          description: Always empty; not indexed by this fork
        child_count:
          type: integer
          description: Always 0; not indexed by this fork
        rune:
          type: string
          nullable: true
          description: Always null; not indexed by this fork
        metaprotocol:
          type: string
          nullable: true
          description: Always null; not indexed by this fork
        previous:
          type: string
          nullable: true
          description: Id of the inscription numbered one lower, or null
        next:
          type: string
          nullable: true
          description: Id of the inscription numbered one higher, or null
    Drc20TokenInventoryItem:
      type: object
      required:
        - ticker
        - deploy_inscription_id
        - deploy_inscription_number
        - decimals
        - max_atomic
        - limit_atomic
        - minted_atomic
        - remaining_atomic
        - holder_count
        - deployed_height
        - deployed_timestamp
        - deployed_by
        - latest_mint_number
        - complete
      properties:
        ticker:
          type: string
        deploy_inscription_id:
          type: string
        deploy_inscription_number:
          type: string
        decimals:
          type: integer
        max_atomic:
          type: string
        limit_atomic:
          type: string
        minted_atomic:
          type: string
        remaining_atomic:
          type: string
        holder_count:
          type: integer
        deployed_height:
          type: integer
        deployed_timestamp:
          type: integer
        deployed_by:
          type: string
        latest_mint_number:
          type: string
        complete:
          type: boolean
    DuneTokenInventoryItem:
      type: object
      required:
        - dune
        - dune_id
        - number
        - divisibility
