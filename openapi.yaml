openapi: 3.0.0
info:
  title: ord-dogecoin HTTP API
  description: >-
    HTTP API served by `ord server` in bitcoinuniverseio/ord-dogecoin: blocks,
    transactions, outputs, inscriptions (Doginals), DRC-20 and Dunes state on
    Dogecoin.


    Three surfaces share one port. The `/api/v1/*` routes are the machine
    contract: every quantity is an exact decimal string, every page is bounded
    and ordered, every response names its indexed checkpoint, and a missing
    index capability is an HTTP 400 with an actionable message rather than an
    empty list. The remaining JSON routes are inherited from upstream
    wonky-ord and are kept for compatibility. The HTML explorer routes are
    documented here only so the surface is complete.


    There is no authentication and no rate limiting. Index feature flags are
    fixed when the database is created and cannot be added later, so call
    `/api/v1/capabilities` before trusting any other endpoint.
  version: '1'
  license:
    name: CC0-1.0
    url: https://creativecommons.org/publicdomain/zero/1.0/
externalDocs:
  description: Repository documentation
  url: https://github.com/bitcoinuniverseio/ord-dogecoin/blob/develop/docs/src/dogecoin/http-api.md
servers:
  - url: http://127.0.0.1:8080
    description: A local ord server

paths:
  /:
    get:
      summary: Explorer home page
      operationId: getHome
      responses:
        '200':
          description: HTML explorer home
          content:
            text/html:
              schema:
                type: string
  /api/v1/capabilities:
    get:
      summary: Report what this index can answer
      description: >-
        Index feature flags are fixed when the database is created and cannot
        be added later. Without this route, a database that never indexed
        DRC-20 answers DRC-20 queries with an empty list, which is
        indistinguishable from a chain with no tokens.
      operationId: getIndexCapabilities
      responses:
        '200':
          description: Chain, indexed checkpoint and index capabilities
          content:
            application/json:
              schema:
                type: object
                required: [chain, network, block_count, block_hash, drc20, dunes, sats, transactions, drc20Decisions, drc20DecisionsFromHeight]
                properties:
                  chain:
                    type: string
                  network:
                    type: string
                    enum: [mainnet, testnet, regtest, signet]
                    description: The configured Dogecoin network
                  block_count:
                    type: integer
                  block_hash:
                    type: string
                  drc20:
                    type: boolean
                    description: Database was created with --index-drc20
                  dunes:
                    type: boolean
                  sats:
                    type: boolean
                  transactions:
                    type: boolean
                    description: Database was created with --index-transactions
                  drc20Decisions:
                    type: boolean
                    description: >-
                      Per-operation DRC-20 verdicts are retained in the same
                      write transaction as the ledger change. False when the
                      database was created without --index-drc20.
                  drc20DecisionsFromHeight:
                    type: integer
                    nullable: true
                    description: >-
                      First height whose DRC-20 verdicts are retained. Null
                      until the decision table has recorded its first block.
                      Operations below it are reported as not-evaluated.
  /api/v1/inscriptions:
    get:
      summary: Walk indexed inscriptions, newest first
      description: >-
        Returns inscriptions with their resolved content metadata and current
        location. When an inscription delegates its content, content_type and
        content_length describe the delegate's bytes, which is what
        /content/{inscription_id} serves.


        subsidy_schedule_hash is the SHA-256 of the raw subsidies.json bytes at
        SUBSIDIES_PATH, read at request time. Two indexes reporting different
        hashes were built from different subsidy schedules and disagree about
        ordinal numbers.
      operationId: getInscriptionInventory
      parameters:
        - name: cursor
          in: query
          required: false
          description: The value returned as next_cursor on the previous page
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          required: false
          description: Maximum number of inscriptions (1-1000, default 250)
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 250
      responses:
        '200':
          description: Paged inscription inventory at the indexed checkpoint
          content:
            application/json:
              schema:
                type: object
                required:
                  - chain
                  - block_count
                  - block_hash
                  - subsidy_schedule_hash
                  - inventory_complete
                  - inscriptions
                properties:
                  chain:
                    type: string
                  block_count:
                    type: integer
                  block_hash:
                    type: string
                  subsidy_schedule_hash:
                    type: string
                    description: SHA-256 of the loaded subsidies.json
                  inventory_complete:
                    type: boolean
                  next_cursor:
                    type: string
                    nullable: true
                  inscriptions:
                    type: array
                    items:
                      $ref: '#/components/schemas/InscriptionInventoryItem'
        '400':
          description: Invalid limit, or SUBSIDIES_PATH is not set
        '404':
          description: The index has no chain tip yet
  /api/v1/inscriptions/{inscription_id}:
    get:
      summary: Get one inscription in the upstream ord JSON layout
      description: >-
        The same document GET /inscription/{inscription_id} answers under
        Accept: application/json, always as JSON. Field names follow upstream
        ord so a consumer written against it reads this fork unchanged; every
        integer is an exact JSON number (a u64 is printed without rounding).
        charms, parents, child_count, rune and metaprotocol are present for
        layout compatibility and always empty: this fork does not index them.
      operationId: getInscriptionDetail
      parameters:
        - name: inscription_id
          in: path
          required: true
          description: Inscription ID (txid followed by i and the index)
          schema:
            type: string
      responses:
        '200':
          description: The inscription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InscriptionDetail'
        '404':
          description: No inscription with that id, or a malformed id
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: ['inscription not found']
  /api/v1/outputs/{outpoint}:
    get:
      summary: Get one transaction output in the upstream ord JSON layout
      description: >-
        The same document GET /output/{outpoint} answers under
        Accept: application/json, always as JSON. Field names follow upstream
        ord so a consumer written against it reads this fork unchanged: runes
        carries the Dunes balance of the output under the upstream key,
        sat_ranges is null without --index-sats, and every integer is an
        exact JSON number.
      operationId: getOutputDetail
      parameters:
        - name: outpoint
          in: path
          required: true
          description: Outpoint as txid:vout
          schema:
            type: string
      responses:
        '200':
          description: The output
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutputDetail'
        '404':
          description: The index does not know the transaction, the vout is out of range, or the outpoint is malformed
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: ['output not found']
  /api/v1/drc20/transferables:
    get:
      summary: List every outstanding DRC-20 transferable inscription
      description: >-
        Answers "what can be spent right now" for DRC-20. This is not the token
        catalog: a deployment with no outstanding transferable does not appear
        here. Use /api/v1/drc20/tokens for the catalog. Not paginated.
      operationId: getDrc20TransferableInventory
      responses:
        '200':
          description: Outstanding DRC-20 transferables at the indexed checkpoint
          content:
            application/json:
              schema:
                type: object
                required: [chain, block_count, block_hash, inventory_complete, transferables]
                properties:
                  chain:
                    type: string
                  block_count:
                    type: integer
                  block_hash:
                    type: string
                  inventory_complete:
                    type: boolean
                  transferables:
                    type: array
                    items:
                      type: object
                      required:
                        - ticker
                        - amount_atomic
                        - decimals
                        - max_atomic
                        - limit_atomic
                        - transfer_inscription_id
                        - inscription_number
                        - owner_address
                        - genesis_height
                        - transaction_index
                        - inscription_index
                      properties:
                        ticker:
                          type: string
                        amount_atomic:
                          type: string
                        decimals:
                          type: integer
                        max_atomic:
                          type: string
                        limit_atomic:
                          type: string
                        transfer_inscription_id:
                          type: string
                        inscription_number:
                          type: string
                        owner_address:
                          type: string
                        genesis_height:
                          type: integer
                        transaction_index:
                          type: integer
                        inscription_index:
                          type: integer
                        location:
                          allOf:
                            - $ref: '#/components/schemas/InventoryLocation'
                          nullable: true
        '404':
          description: The index has no chain tip yet
  /api/v1/drc20/tokens:
    get:
      summary: Get the DRC-20 deployment catalog with indexed protocol state
      description: >-
        Returns deployed DRC-20 tokens and their protocol state. This is not
        the transferable inventory: a deployment with no outstanding
        transferable still appears here. Requires an index built with
        --index-drc20.
      operationId: getDrc20TokenCatalog
      parameters:
        - name: cursor
          in: query
          required: false
          description: Decimal offset over the deterministic ticker order
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of tokens (1-1000, default 250)
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 250
      responses:
        '200':
          description: Paged DRC-20 deployment catalog at the indexed checkpoint
          content:
            application/json:
              schema:
                type: object
                required:
                  - chain
                  - drc20_index_enabled
                  - block_count
                  - block_hash
                  - inventory_complete
                  - total_count
                  - tokens
                properties:
                  chain:
                    type: string
                  drc20_index_enabled:
                    type: boolean
                    description: >-
                      False when this database was created without
                      --index-drc20, so an empty catalog is never ambiguous
                  block_count:
                    type: integer
                  block_hash:
                    type: string
                  inventory_complete:
                    type: boolean
                  total_count:
                    type: integer
                  next_cursor:
                    type: string
                    nullable: true
                  tokens:
                    type: array
                    items:
                      $ref: '#/components/schemas/Drc20TokenInventoryItem'
        '400':
          description: >-
            Invalid cursor or limit, or this database was created without
            --index-drc20 and cannot serve DRC-20 state
  /api/v1/drc20/tokens/{tick}:
    get:
      summary: Get one DRC-20 deployment with its indexed protocol state
      description: >-
        Same item contract as the catalog. Requires an index built with
        --index-drc20.
      operationId: getDrc20TokenDetail
      parameters:
        - name: tick
          in: path
          required: true
          description: The four-byte DRC-20 ticker
          schema:
            type: string
      responses:
        '200':
          description: One DRC-20 deployment at the indexed checkpoint
          content:
            application/json:
              schema:
                type: object
                required:
                  - chain
                  - drc20_index_enabled
                  - block_count
                  - block_hash
                  - inventory_complete
                  - token
                properties:
                  chain:
                    type: string
                  drc20_index_enabled:
                    type: boolean
                  block_count:
                    type: integer
                  block_hash:
                    type: string
                  inventory_complete:
                    type: boolean
                  token:
                    $ref: '#/components/schemas/Drc20TokenInventoryItem'
        '400':
          description: >-
            This database was created without --index-drc20 and cannot serve
            DRC-20 state
        '404':
          description: Unknown ticker
  /api/v1/drc20/operations/{inscriptionId}:
    get:
      summary: Get the retained verdict for one DRC-20 operation
      description: >-
        Answers whether the indexer accepted or rejected the DRC-20 operation
        an inscription carried, and why. The verdict was written in the same
        write transaction as the ledger change it explains and is rolled back
        with it on a reorg. An inscription's own deploy, mint or
        inscribe-transfer is the operation whose txid equals the inscription's
        txid; its later first transfer is listed by the collection route with
        ?txid=. A verdict of not-evaluated with a reason is neither an
        acceptance nor a rejection and must not be inferred into one.
      operationId: getDrc20OperationDecision
      parameters:
        - name: inscriptionId
          in: path
          required: true
          description: Inscription id, txid followed by i and the index
          schema:
            type: string
      responses:
        '200':
          description: The retained verdict, or an explicit not-evaluated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Drc20OperationDecision'
        '404':
          description: The inscription is not indexed
  /api/v1/drc20/operations:
    get:
      summary: List every retained DRC-20 verdict for one transaction
      description: >-
        One transaction can inscribe an operation and spend several
        inscribe-transfer inscriptions at once; each is a separate record.
        An empty list means no verdict is retained for that txid; coverage
        says whether the index could have retained one.
      operationId: listDrc20TransactionDecisions
      parameters:
        - name: txid
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Retained verdicts for the transaction
          content:
            application/json:
              schema:
                type: object
                required: [txid, decisions, coverage]
                properties:
                  txid:
                    type: string
                  decisions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Drc20OperationDecision'
                  coverage:
                    $ref: '#/components/schemas/Drc20DecisionCoverage'
        '400':
          description: >-
            Missing or malformed txid, or this database was created without
            --index-drc20
  /api/v1/dunes/tokens:
    get:
      summary: Get the dune catalog with indexed protocol state
      description: >-
        Returns etched dunes ordered by etching. Every quantity is an exact
        decimal string, because dune supply arithmetic is u128 and no JSON
        number can carry one. divisibility is the only rule by which an amount
        here may be scaled for display. Requires an index built with
        --index-dunes.
      operationId: getDuneTokenCatalog
      parameters:
        - name: cursor
          in: query
          required: false
          description: Decimal offset over the deterministic etching order
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of dunes (1-1000, default 250)
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 250
      responses:
        '200':
          description: Paged dune catalog at the indexed checkpoint
          content:
            application/json:
              schema:
                type: object
                required:
                  - chain
                  - dune_index_enabled
                  - block_count
                  - block_hash
                  - inventory_complete
                  - total_count
                  - tokens
                properties:
                  chain:
                    type: string
                  dune_index_enabled:
                    type: boolean
                    description: >-
                      False when this database was created without
                      --index-dunes
                  block_count:
                    type: integer
                  block_hash:
                    type: string
                  inventory_complete:
                    type: boolean
                  total_count:
                    type: integer
                  next_cursor:
                    type: string
                    nullable: true
                  tokens:
                    type: array
                    items:
                      $ref: '#/components/schemas/DuneTokenInventoryItem'
        '400':
          description: >-
            Invalid cursor or limit, or this database was created without
            --index-dunes and cannot serve dune state
  /api/v1/dunes/tokens/{dune}:
    get:
      summary: Get one dune by spaced name or block:index identifier
      operationId: getDuneTokenDetail
      parameters:
        - name: dune
          in: path
          required: true
          description: The spaced dune name, or the block:index identifier of the etching
          schema:
            type: string
      responses:
        '200':
          description: One dune at the indexed checkpoint
          content:
            application/json:
              schema:
                type: object
                required:
                  - chain
                  - dune_index_enabled
                  - block_count
                  - block_hash
                  - inventory_complete
                  - token
                properties:
                  chain:
                    type: string
                  dune_index_enabled:
                    type: boolean
                  block_count:
                    type: integer
                  block_hash:
                    type: string
                  inventory_complete:
                    type: boolean
                  token:
                    $ref: '#/components/schemas/DuneTokenInventoryItem'
        '400':
          description: >-
            This database was created without --index-dunes and cannot serve
            dune state
        '404':
          description: Unknown dune
  /api/v1/drc20/tokens/{tick}/holders:
    get:
      summary: Get DRC-20 holder balances for one ticker
      operationId: getDrc20TokenHolders
      parameters:
        - name: tick
          in: path
          required: true
          description: DRC-20 ticker
          schema:
            type: string
        - name: cursor
          in: query
          required: false
          description: Decimal offset over the deterministic holder order
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of holders (1-1000, default 250)
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 250
      responses:
        '200':
          description: Paged holder balances in atomic units
          content:
            application/json:
              schema:
                type: object
                required: [chain, block_count, block_hash, ticker, inventory_complete, total_count, holders]
                properties:
                  chain:
                    type: string
                  block_count:
                    type: integer
                  block_hash:
                    type: string
                  ticker:
                    type: string
                  inventory_complete:
                    type: boolean
                  total_count:
                    type: integer
                  next_cursor:
                    type: string
                    nullable: true
                  holders:
                    type: array
                    items:
                      type: object
                      required: [address, overall_atomic, transferable_atomic, available_atomic]
                      properties:
                        address:
                          type: string
                        overall_atomic:
                          type: string
                        transferable_atomic:
                          type: string
                        available_atomic:
                          type: string
        '404':
          description: Unknown DRC-20 ticker
  /api/v1/funding/{address}:
    get:
      summary: Get confirmed cardinal funding proofs
      operationId: getCardinalFundingProofs
      parameters:
        - name: address
          in: path
          required: true
          description: Canonically encoded Dogecoin address
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of inputs (1-50, default 20)
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Complete confirmed cardinal funding inventory
          content:
            application/json:
              schema:
                type: object
                required: [chain, block_count, block_hash, address, inventory_complete, total_count, truncated, inputs]
                properties:
                  chain:
                    type: string
                    enum: [dogecoin]
                  block_count:
                    type: integer
                  block_hash:
                    type: string
                  address:
                    type: string
                  inventory_complete:
                    type: boolean
                    enum: [true]
                    description: The authoritative index is complete at block_count; this does not mean the bounded input page is untruncated.
                  total_count:
                    type: integer
                    minimum: 0
                    description: Complete number of confirmed cardinal UTXOs before applying limit.
                  truncated:
                    type: boolean
                    description: True when total_count is greater than the number of returned inputs.
                  inputs:
                    type: array
                    items:
                      type: object
                      required:
                        [txid, vout, value_sats, script_pubkey, raw_previous_transaction, confirmations]
                      properties:
                        txid:
                          type: string
                        vout:
                          type: integer
                          minimum: 0
                        value_sats:
                          type: string
                        script_pubkey:
                          type: string
                        raw_previous_transaction:
                          type: string
                        confirmations:
                          type: integer
                          minimum: 1

  /block-count:
    get:
      summary: Get block count
      operationId: getBlockCount
      responses:
        '200':
          description: Block count
          content:
            text/plain:
              schema:
                type: string

  /block/{query}:
    get:
      summary: Get block by height or hash
      operationId: getBlock
      parameters:
        - name: query
          in: path
          required: true
          description: Block height or hash
          schema:
            type: string
      responses:
        '200':
          description: Block details
          content:
            text/html:
              schema:
                type: string

  /blocks/{start}/{end}:
    get:
      summary: Get blocks in range
      operationId: getBlocks
      parameters:
        - name: start
          in: path
          required: true
          description: Start block height
          schema:
            type: integer
        - name: end
          in: path
          required: true
          description: End block height
          schema:
            type: integer
        - name: no_inscriptions
          in: query
          required: false
          description: Skip inscriptions data
          schema:
            type: boolean
        - name: no_input_data
          in: query
          required: false
          description: Skip input data
          schema:
            type: boolean
      responses:
        '200':
          description: Blocks details
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /tx/{txid}:
    get:
      summary: Get transaction details
      operationId: getTransaction
      parameters:
        - name: txid
          in: path
          required: true
          description: Transaction ID
          schema:
            type: string
        - name: json
          in: query
          required: false
          description: Return response in JSON format
          schema:
            type: boolean
      responses:
        '200':
          description: Transaction details
          content:
            text/html:
              schema:
                type: string
            application/json:
              schema:
                type: object

  /output/{output}:
    get:
      summary: Get output details by OutPoint
      operationId: getOutput
      parameters:
        - name: output
          in: path
          required: true
          description: "OutPoint (format: txid:vout)"
          schema:
            type: string
      responses:
        '200':
          description: Output details
          content:
            text/html:
              schema:
                type: string

  /utxos/balance/{address}:
    get:
      summary: Get UTXO balance for an address
      operationId: getUtxosBalance
      parameters:
        - name: address
          in: path
          required: true
          description: Cryptocurrency address
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Limit the number of results
          schema:
            type: integer
        - name: show_all
          in: query
          required: false
          description: Show all UTXOs
          schema:
            type: boolean
        - name: show_unsafe
          in: query
          required: false
          description: Show unsafe UTXOs
          schema:
            type: boolean
        - name: value_filter
          in: query
          required: false
          description: Filter UTXOs by value
          schema:
            type: integer
      responses:
        '200':
          description: UTXO balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  utxos:
                    type: array
                    items:
                      type: object
                  total_shibes:
                    type: integer
                  total_utxos:
                    type: integer
                  total_inscription_shibes:
                    type: integer

  /drc20/balance/{address}:
    get:
      summary: Get DRC20 balance for an address
      operationId: getDrc20Balance
      parameters:
        - name: address
          in: path
          required: true
          description: Cryptocurrency address
          schema:
            type: string
        - name: tick
          in: query
          required: false
          description: Filter by token tick
          schema:
            type: string
        - name: show_utxos
          in: query
          required: false
          description: Show UTXO information
          schema:
            type: boolean
        - name: value_filter
          in: query
          required: false
          description: Filter by value
          schema:
            type: integer
      responses:
        '200':
          description: DRC20 balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  drc20:
                    type: array
                    items:
                      type: object

  /drc20/tick/{tick}:
    get:
      summary: Get DRC20 tick information
      operationId: getDrc20TickInfo
      parameters:
        - name: tick
          in: path
          required: true
          description: DRC20 tick identifier
          schema:
            type: string
      responses:
        '200':
          description: DRC20 tick information
          content:
            application/json:
              schema:
                type: object

  /drc20/tick:
    get:
      summary: Get all DRC20 tick information
      operationId: getAllDrc20TickInfo
      responses:
        '200':
          description: DRC20 tick information
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /drc20/validate:
    get:
      summary: Validate DRC20 inscriptions
      operationId: validateDrc20
      parameters:
        - name: addresses
          in: query
          required: true
          description: Comma-separated list of addresses
          schema:
            type: string
        - name: inscription_ids
          in: query
          required: true
          description: Comma-separated list of inscription IDs
          schema:
            type: string
      responses:
        '200':
          description: Validation results
          content:
            application/json:
              schema:
                type: object

  /dune/{dune}:
    get:
      summary: Get dune details
      operationId: getDune
      parameters:
