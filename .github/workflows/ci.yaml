name: CI

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: runs-on=${{ github.run_id }}-lint/runner=universe-hosted/cpu=2+8/env=production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Format
        run: rustfmt --check tests/compatibility.rs
      - name: Clippy
        run: cargo clippy --locked -p ord-dogecoin --lib --bin ord --test compatibility --test authority-api-contract --all-features
      - name: Check for forbidden words
        run: ./bin/forbid
      - name: Validate AWS Dogecoin migration controls
        run: |
          bash -n deploy/aws-doge-index/migrate-source.sh
          bash -n deploy/aws-doge-index/cutover-source.sh
          bash -n deploy/aws-doge-index/validate-index.sh
          bash -n deploy/aws-doge-index/controller/bootstrap.sh
          python -m py_compile deploy/aws-doge-index/controller/controller.py
          awk '/doge-index-run <<.RUNNER./{capture=1;next} /^RUNNER$/{capture=0} capture' \
            deploy/aws-doge-index/controller/bootstrap.sh | bash -n
          awk '/doge-index-activate <<.ACTIVATE./{capture=1;next} /^ACTIVATE$/{capture=0} capture' \
            deploy/aws-doge-index/controller/bootstrap.sh | bash -n
          grep -Fq '[[ "$height_limit" == "$expected_limit" ]]' \
            deploy/aws-doge-index/controller/bootstrap.sh
          grep -Fq 'ExecStart=/usr/local/sbin/doge-index-run' \
            deploy/aws-doge-index/controller/bootstrap.sh
          grep -Fq 'Type=oneshot' \
            deploy/aws-doge-index/source/universe-doge-ebs-cutover.service
          grep -Fq 'TimeoutStartSec=infinity' \
            deploy/aws-doge-index/source/universe-doge-ebs-cutover.service
          grep -Fq -- '-R 127.0.0.1:22566:127.0.0.1:22566' \
            deploy/aws-doge-index/source/universe-doge-rpc-tunnel.service
          grep -Fq -- '-L 127.0.0.1:8390:127.0.0.1:8390' \
            deploy/aws-doge-index/source/universe-doge-rpc-tunnel.service
          grep -Fq 'systemctl start --no-block universe-doge-ebs-cutover' \
            deploy/aws-doge-index/README.md
          grep -Fq -- '- ec2:RunInstances' deploy/aws-doge-index/template.yaml
          grep -Fq 'ConditionExpression="#owner = :owner"' \
            deploy/aws-doge-index/controller/controller.py
          grep -Fq 'ExpressionAttributeNames={"#owner": "owner"}' \
            deploy/aws-doge-index/controller/controller.py

  test-linux:
    runs-on: runs-on=${{ github.run_id }}-test_linux/runner=universe-hosted/cpu=2+8/env=production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Check production library and binaries
        run: cargo check --locked --workspace --lib --bins --all-features
      - name: Test Dogecoin protocol compatibility
        run: cargo test --locked --test compatibility
      - name: Test authority API contract
        run: cargo test --locked --test authority-api-contract

  test-windows:
    runs-on: runs-on=${{ github.run_id }}-test_windows/runner=universe-windows/cpu=4+16/env=production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Check production library and binaries
        run: cargo check --locked --workspace --lib --bins --all-features
      - name: Test Dogecoin protocol compatibility
        run: cargo test --locked --test compatibility
      - name: Test authority API contract
        run: cargo test --locked --test authority-api-contract

  docs:
    runs-on: runs-on=${{ github.run_id }}-docs/runner=universe-hosted/cpu=2+8/env=production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Install documentation toolchain
        run: |
          cargo install --locked mdbook --version 0.4.52
          cargo install --locked mdbook-linkcheck --version 0.7.7
      - run: mdbook build docs

  release:
    runs-on: runs-on=${{ github.run_id }}-release/runner=universe-hosted/cpu=2+8/env=production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Build production binary
        run: cargo build --locked --release --bin ord
      - name: Smoke test production binary
        run: target/release/ord --version
